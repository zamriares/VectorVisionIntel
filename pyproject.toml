[tool.ruff]
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "SIM", "UP", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests", "ml"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
