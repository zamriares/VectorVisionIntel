version: "2"
run:
  timeout: 5m
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - exhaustive
    - govet
    - ineffassign
    - noctx
    - revive
    - staticcheck
    - unused
  exclusions:
    generated: strict
formatters:
  enable:
    - gofmt
    - goimports
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
